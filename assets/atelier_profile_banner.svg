<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-prof" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161412" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0D0B0A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-prof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC878"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7832"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="450" fill="#060505"/>
  <rect width="1200" height="450" fill="url(#vignette-prof)"/>

  <!-- Architectural Outer Border -->
  <rect x="24" y="24" width="1152" height="402" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="394" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 426 h16 M24 422 v16"/>
    <path d="M1180 426 h-16 M1176 422 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="426" r="3" fill="none"/>
    <circle cx="1176" cy="426" r="3" fill="none"/>
  </g>

  <!-- Left Visual Motif: The Master Astrolabe & Armillary Sphere (Da Vinci / Bohemian) -->
  <g transform="translate(230, 225)" stroke="#C5A059" fill="none">
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="170"/>
      <circle cx="0" cy="0" r="135"/>
      <circle cx="0" cy="0" r="100"/>
      <circle cx="0" cy="0" r="60"/>
      <circle cx="0" cy="0" r="25"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-127" y1="-127" x2="127" y2="127"/>
      <line x1="-127" y1="127" x2="127" y2="-127"/>
    </g>

    <!-- Armillary Elliptical Rings -->
    <ellipse cx="0" cy="0" rx="145" ry="55" stroke="url(#gold-prof)" stroke-width="1.2" stroke-opacity="0.75" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="145" ry="55" stroke="#C5A059" stroke-width="0.8" stroke-opacity="0.4" transform="rotate(35)"/>
    
    <!-- Central Solar Pivot & Constellation Points -->
    <circle cx="0" cy="0" r="5" fill="#EAC878"/>
    <circle cx="95" cy="-45" r="2.5" fill="#EAC878" opacity="0.8"/>
    <circle cx="-110" cy="50" r="2" fill="#EAC878" opacity="0.6"/>
    <circle cx="-50" cy="-90" r="2" fill="#EAC878" opacity="0.6"/>

    <!-- Compass Degree Ring -->
    <circle cx="0" cy="0" r="150" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.5"/>
    
    <text x="-170" y="-150" fill="#C5A059" opacity="0.4" font-size="9" class="mono-tech">FIG. 0 — CODEX ET ATELIER</text>
    <text x="-170" y="175" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">CREATIVE PROBLEM SOLVER • LAT 0x7F4A</text>
  </g>

  <!-- Typography & Creator Identity (Center-Right Cluster) -->
  <g transform="translate(470, 0)">
    <!-- Supertitle -->
    <text x="0" y="130" fill="#C5A059" font-size="12" letter-spacing="5" class="serif-title" opacity="0.85">
      THE INVENTOR'S CODEX &amp; OPEN SOURCE ATELIER
    </text>

    <!-- Main Title (Jaswanth) -->
    <text x="0" y="195" fill="#FDFBF7" font-size="58" letter-spacing="14" class="serif-title">
      J A S W A N T H
    </text>

    <!-- Bohemian Gold Line -->
    <g transform="translate(0, 222)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="430" y2="0" stroke-width="0.8"/>
      <circle cx="215" cy="0" r="3" fill="#C5A059"/>
      <circle cx="107" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="323" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <!-- Subtitle / Persona -->
    <text x="0" y="258" fill="#C5BEB3" font-size="14" letter-spacing="2" class="serif-title" opacity="0.9">
      CREATIVE PROBLEM SOLVER • LIFELONG APPRENTICE • SYSTEMS ARTISAN
    </text>

    <!-- Manifesto / Core Driving Belief -->
    <text x="0" y="292" fill="#E6DFD5" font-size="14" class="serif-sub">
      "Crafting mindful software, ambient interfaces, and autonomous systems to elevate everyday quality of life."
    </text>

    <!-- Tri-Rail Pillars -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="135" height="26" rx="2" fill="#141210" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="67" y="17" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">AMBIENT SYSTEMS</text>

      <rect x="147" y="0" width="135" height="26" rx="2" fill="#141210" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="214" y="17" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">COGNITIVE MEMORY</text>

      <rect x="294" y="0" width="135" height="26" rx="2" fill="#141210" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="17" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">OPEN RESEARCH</text>
    </g>

    <text x="0" y="390" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      GIVING BACK TO OPEN SOURCE • ANNO MMXXVI • @JASWANTH1902
    </text>
  </g>
</svg>