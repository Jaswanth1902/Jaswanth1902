<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-j-logo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#171412" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0D0B0A" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#060505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-j-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC878"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7832"/>
    </linearGradient>
    <style>
      .serif-display { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Georgia', serif; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="400" height="400" fill="#060505"/>
  <rect width="400" height="400" fill="url(#vignette-j-logo)"/>

  <!-- Outer Border -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.25"/>

  <!-- Celestial Armillary Rings & Master Monogram -->
  <g transform="translate(200, 200)" stroke="#C5A059" fill="none">
    <circle cx="0" cy="0" r="145" stroke-width="0.8" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="135" ry="50" stroke="url(#gold-j-logo)" stroke-width="1" stroke-opacity="0.65" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="135" ry="50" stroke="#C5A059" stroke-width="0.7" stroke-opacity="0.35" transform="rotate(40)"/>
    <circle cx="0" cy="0" r="95" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- Micro Stars -->
    <circle cx="70" cy="-60" r="2.5" fill="#EAC878" stroke="none"/>
    <circle cx="-80" cy="40" r="2" fill="#EAC878" stroke="none" opacity="0.7"/>

    <!-- Luxury Serif Monogram 'J' -->
    <text x="0" y="42" fill="#FDFBF7" font-size="98" text-anchor="middle" class="serif-display" stroke="none">J</text>

    <text x="0" y="85" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.7">J A S W A N T H</text>
    <text x="0" y="98" fill="#C5A059" font-size="6" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.4">OPEN ATELIER • MMXXVI</text>
  </g>
</svg>